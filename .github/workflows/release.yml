name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Test window layout and shortcuts
        run: swift test
      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Build universal application and checksum
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WindowSnap-universal
          path: |
            dist/WindowSnap-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: WindowSnap-universal
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/WindowSnap-universal.zip dist/SHA256SUMS.txt \
            --verify-tag --title "WindowSnap $RELEASE_TAG" --notes-file RELEASE_NOTES.md
